version: "1.0"

apps:
  devup_v2:
    name: "devup_v2"
    description: "DevUp - Extensible Development Environment Manager"
    workdir: "/Users/everton.jesus/workspace/devup_v2"

    services:
      - name: app
        type: process
        command: "go run ."
        port: 3000
        logfile: "logs/app.log"
        environment:
          DEVUP_DEFAULT_PROJECT: "changeme"


    setup:
      env_vars:
        - name: "DEVUP_DEFAULT_PROJECT"
          default: "changeme"
          required: false
    modes:
      default:
        name: "Development"
        description: "Full development environment"
        services:
          - app

    install:
      steps:
        - name: "Download Go modules"
          command: "go mod download"

    hooks:
      pre_start:
        - "mkdir -p logs"
      post_start:
        - "echo 'Application started successfully'"
