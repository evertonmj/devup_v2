# DevUp Configuration File
# This is the main configuration for devup CLI

version: "1.0"

apps:
  # Example: Sample application configuration
  sample-app:
    name: "Sample Application"
    description: "Example application with multiple services"
    workdir: "."

    services:
      - name: frontend
        type: process
        command: "npm start"
        port: 3000
        logfile: "logs/frontend.log"
        healthcheck:
          type: http
          endpoint: "http://localhost:3000"
          timeout: 30s
          interval: 5s
          retries: 6

      - name: api
        type: process
        command: "npm run start:api"
        port: 8000
        logfile: "logs/api.log"
        healthcheck:
          type: http
          endpoint: "http://localhost:8000/health"
          timeout: 30s
          interval: 5s
          retries: 6

    modes:
      default:
        name: "Default Mode"
        description: "Run all services"
        services:
          - frontend
          - api

      frontend-only:
        name: "Frontend Only"
        description: "Run only frontend for UI development"
        services:
          - frontend

# Add more apps below as needed
# See examples/ directory for more configuration templates
