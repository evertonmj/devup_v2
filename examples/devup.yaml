# DevUp Configuration Template
# Copy this file to your project and customize it

version: "1.0"

apps:
  my-app:
    name: "My Application"
    description: "A starter template for DevUp"
    workdir: "."

    # Services - the building blocks of your application
    services:
      - name: web
        type: process
        command: "npm run dev"  # Change to your command
        workdir: "."
        port: 3000
        logfile: "logs/web.log"
        healthcheck:
          type: http
          endpoint: "http://localhost:3000"
          timeout: 30s
          interval: 2s
          retries: 15
        environment:
          NODE_ENV: development

      - name: api
        type: process
        command: "npm start"  # Change to your command
        workdir: "."
        port: 8080
        logfile: "logs/api.log"
        dependencies:
          - database
        healthcheck:
          type: http
          endpoint: "http://localhost:8080/health"
          timeout: 30s
          interval: 2s
          retries: 15

      - name: database
        type: process
        command: "docker run --rm -p 5432:5432 -e POSTGRES_PASSWORD=password postgres:15"
        port: 5432
        logfile: "logs/database.log"
        healthcheck:
          type: tcp
          endpoint: "localhost:5432"
          timeout: 10s
          interval: 1s
          retries: 10

    # Modes - different configurations for different scenarios
    modes:
      default:
        name: "Development"
        description: "Full stack development mode"
        services:
          - database
          - api
          - web
        environment:
          DEBUG: "true"

      frontend-only:
        name: "Frontend Only"
        description: "UI development only"
        services:
          - web
        overrides:
          - service: web
            environment:
              API_URL: "https://staging.api.example.com"

      production:
        name: "Production"
        description: "Production-like environment"
        services:
          - database
          - api
          - web
        environment:
          NODE_ENV: production
        overrides:
          - service: api
            command: "npm run start:prod"

    # Installation configuration (optional)
    install:
      dependencies:
        - name: "Node.js"
          type: brew
          package: node
          check: "node --version"

      steps:
        - name: "Install dependencies"
          commands:
            - "npm install"
          skip_if: "[ -d node_modules ]"

    # Setup configuration (optional)
    setup:
      directories:
        - "logs"
        - "tmp"
        - "data"

      env_vars:
        - name: "SECRET_KEY"
          description: "Application secret key"
          generate: "openssl rand -hex 32"
          required: true

        - name: "DATABASE_URL"
          description: "Database connection string"
          prompt: true
          default: "postgresql://localhost:5432/mydb"
          required: true

        - name: "LOG_LEVEL"
          default: "INFO"

      scripts:
        - "chmod +x scripts/*.sh"

      checks:
        - name: "Dependencies installed"
          command: "[ -d node_modules ]"
          message: "Run 'devup install' first"

    # Lifecycle hooks (optional)
    hooks:
      pre_start:
        - "mkdir -p logs data tmp"
        - "echo 'Starting application...'"

      post_start:
        - "echo 'Application started successfully!'"
        - "echo 'Visit: http://localhost:3000'"

      pre_stop:
        - "echo 'Stopping application...'"

      post_stop:
        - "echo 'Application stopped.'"

# Add more applications below as needed
# Example:
