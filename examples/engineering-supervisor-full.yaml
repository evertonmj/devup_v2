# Complete Engineering Supervisor Agent Configuration
# Includes install and setup automation

version: "1.0"

apps:
  engineering-supervisor:
    name: "Engineering Supervisor Agent"
    description: "Full-stack application with automated setup"
    workdir: "/Users/everton.jesus/workspace/projects/gilead/engineering-supervisor-agent/Container"

    # Installation configuration
    install:
      dependencies:
        - name: "Python 3.12+"
          type: brew
          package: python@3.12
          check: "python3.12 --version"

        - name: "Node.js 18+"
          type: brew
          package: node
          check: "node --version | grep -E 'v1[89]|v[2-9][0-9]'"

        - name: "tmux"
          type: brew
          package: tmux
          check: "tmux -V"

        - name: "Caddy"
          type: brew
          package: caddy
          check: "caddy version"

        - name: "OpenSSL"
          type: brew
          package: openssl
          check: "openssl version"
          optional: true

      steps:
        - name: "Install UI dependencies"
          description: "Install Node.js packages for the UI"
          workdir: "ui"
          commands:
            - "npm install"
          skip_if: "[ -d node_modules ]"

        - name: "Create Python virtual environment"
          description: "Set up Python virtual environment"
          workdir: "service"
          commands:
            - "python3.12 -m venv venv"
          skip_if: "[ -d venv ]"

        - name: "Install Python dependencies"
          description: "Install Python packages"
          workdir: "service"
          commands:
            - "source venv/bin/activate && pip install -r requirements.txt -r requirements-test.txt"

    # Environment setup configuration
    setup:
      directories:
        - "logs"
        - "tmp"
        - "data"

      env_vars:
        # SAML Configuration
        - name: "SAML_ENTITY_ID"
          description: "SAML Entity ID"
          default: "https://localhost:3000"

        - name: "SAML_META_DATA"
          description: "SAML metadata XML content (read from file)"
          generate: "cat /Users/everton.jesus/workspace/projects/gilead/engineering-supervisor-agent/Container/saml.xml 2>/dev/null || echo ''"

        - name: "HTTPS_ACS_URL"
          description: "HTTPS ACS callback URL"
          default: "https://localhost:3000/api/sso/saml"

        - name: "ACS_URL"
          description: "ACS callback URL"
          default: "https://localhost:3000/api/sso/saml"

        # Application Configuration
        - name: "APP_ENV"
          description: "Application environment"
          default: "LOCAL"

        - name: "FRONTEND_URL"
          description: "Frontend URL"
          default: "https://localhost:3000/chat"

        - name: "JWT_SECRET_KEY"
          description: "Secret key for JWT tokens"
          default: "OF0Fcvi9A+3ax38YOwphzVqyT8Q9/HyogAJIyK20iJI="

        - name: "PROJECT_ROOT"
          description: "Project root directory"
          default: "/Users/everton.jesus/workspace/projects/gilead/engineering-supervisor-agent"

        - name: "ENABLE_JSON_LOGS"
          description: "Enable JSON formatted logs"
          default: "False"

        # Databricks Configuration
        - name: "DATABRICKS_AUTH_KEY"
          description: "Databricks authentication key"
          default: "dapi1a45f4cc617495ece420ac93f1996453"

        - name: "DATABRICKS_CLIENT_ID"
          description: "Databricks OAuth client ID"
          default: "d82f4157-96be-4482-854e-b8c53e79c1c5"

        - name: "DATABRICKS_CLIENT_SECRET"
          description: "Databricks OAuth client secret"
          default: "dose9c46c970c6e38591dd680af42623700c"

        - name: "DATABRICKS_TOKEN_ENCRYPTION_KEY"
          description: "Encryption key for Databricks tokens"
          default: "4ZYJ0cVvXQGZnF5d0Chr4JZycLXd61f53Rtx4vGP3ew="

        - name: "AGENT_SUPERVISOR_ENDPOINT"
          description: "Databricks agent supervisor endpoint"
          default: "https://dbc-03f083b6-1350.cloud.databricks.com/serving-endpoints/supervisor-agent-supervisor-agent-v1-2-ai-gateway"

        - name: "DATABRICKS_HOST"
          description: "Databricks host URL"
          default: "https://dbc-03f083b6-1350.cloud.databricks.com"

        - name: "DATABRICKS_TOKEN"
          description: "Databricks access token"
          default: "dapi1a45f4cc617495ece420ac93f1996453"

        - name: "DATABRICKS_SQL_HTTP_PATH"
          description: "Databricks SQL HTTP path"
          default: "/sql/1.0/warehouses/4e3170e76b1ac84d"

        - name: "DATABRICKS_SQL_HOST"
          description: "Databricks SQL host URL"
          default: "https://dbc-03f083b6-1350.cloud.databricks.com"

        - name: "UNITY_CATALOG_NAME"
          description: "Unity Catalog name"
          default: "engineering-supervisor-agent-dev"

        - name: "UNITY_SCHEMA_NAME"
          description: "Unity Schema name"
          default: "local_test_as_2"

        # Session Configuration
        - name: "SESSION_SECRET"
          description: "Session secret key"
          default: "verylongsecretkeythatshouldbechanged"

        # Okta SSO Configuration
        - name: "OKTA_ISSUER"
          description: "Okta issuer URL"
          default: "https://trial-2738986.okta.com"

        - name: "OKTA_CLIENT_ID"
          description: "Okta OAuth client ID"
          default: "0oasfzuttoZacz0Ec697"

        - name: "OKTA_CLIENT_SECRET"
          description: "Okta OAuth client secret"
          default: "sJPdnHovsO9iaMOTVrIT1SNPzAEizI2JZrrclv878gTHGX_PuI65CGLdwgwtWcD8"

        - name: "REDIRECT_URI"
          description: "OAuth redirect URI"
