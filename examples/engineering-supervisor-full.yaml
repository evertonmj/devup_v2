        # Sample Databricks Token (for testing)
        - name: "SAMPLE_DATABRICKS_ACCESS_TOKEN"
          description: "Sample Databricks access token for testing"
          default: "{\"access_token\": \"eyJraWQiOiJkZmJjOWVmMThjZTQ2ZTlhMDg2NWZmYzlkODkxYzJmMjg2NmFjMDM3MWZiNDlmOTdhMDg1MzBjNWYyODU3ZTg4IiwidHlwIjoiYXQrand0IiwiYWxnIjoiUlMyNTYifQ..f7ZbWHEj_vMKNZUmyAJpUfjifkfqZvFCC3UU35YxiW7eyGBgmnjvHrNJa-GQ9d-4NSViXHZBsNNT6Yr_9AP6hyfoVtvi-uxoJidP-9X6nrQ4L6-tUCQYRUPwoqm0n2LFxVN9I_SB7RmrnSiPnxeXmBmKbD5raXUxHY0pWhpPQGhLfWNCKbWNXTk00gnp9N7LQo7y9jeEq5XRJF4WoJg-HMZmpAr5VMKUnj09h42lhVXm1WDP2IOn0bnbGHIa4iEBfxRbDsq0hAp6dzAAS7gr5OUQkbtE4jpPcOVzYcO9-W-FWZbfuI9CF-Zj_zWVUiN_Pn6tHSgGomcix07IWTZAiw\", \"issued_token_type\": \"urn:ietf:params:oauth:token-type:access_token\", \"scope\": \"all-apis\", \"token_type\": \"Bearer\", \"expires_in\": 3593}"

        - name: "INFRA_BASE_URL"
          description: "Infrastructure base URL"
          default: "https://localhost:3000"

        # Development Configuration
        - name: "NODE_ENV"
          description: "Node environment"
          default: "development"

        - name: "LOG_LEVEL"
          description: "Logging level"
          default: "INFO"

      scripts:
        - "echo 'Environment setup complete'"

      checks:
        - name: "Python virtual environment exists"
          command: "[ -d service/venv ]"
          message: "Python virtual environment not found"

        - name: "Node modules installed"
          command: "[ -d ui/node_modules ]"
          message: "Node modules not installed"

        - name: "Environment file exists"
          command: "[ -f .env ]"
          message: "Environment file not created"

    # Services configuration
    services:
      - name: ui
        type: process
        command: "cd ui && npm run start"
        workdir: "."
        port: 3006
        logfile: "logs/ui.log"
        environment:
          NODE_ENV: development

      - name: caddy
        type: process
        command: "cd service && caddy run --config Caddyfile"
        workdir: "."
        port: 3000
        logfile: "logs/caddy.log"
        dependencies:
          - ui

      - name: mock-backend
        type: process
        command: "cd ui && npm run mock"
        workdir: "."
        port: 8000
        logfile: "logs/service.log"

      - name: python-backend
        type: process
        command: |
          cd service && \
          source venv/bin/activate && \
          source ../.env 2>/dev/null || true && \
          export PYTHONPATH=src:tests && \
          python3.12 tests/testbotofbots/localmock/main.py
        workdir: "."
        port: 8000
        logfile: "logs/service.log"

    # Running modes
    modes:
      default:
        name: "Mock Backend"
        services:
          - ui
          - caddy
          - mock-backend

      py:
        name: "Python Backend"
        services:
          - ui
          - caddy
          - python-backend

    # Lifecycle hooks
    hooks:
      pre_install:
        - "echo 'Starting installation...'"

      post_install:
        - "echo 'Installation complete! Run: devup setup'"

      pre_setup:
        - "echo 'Setting up environment...'"

      post_setup:
        - "echo 'Setup complete! Run: devup start'"

      pre_start:
        - "mkdir -p logs"

      post_start:
        - "echo 'Application started! Visit https://localhost:3006'"
